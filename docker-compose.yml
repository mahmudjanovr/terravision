services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: terravision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: terravision
      POSTGRES_PASSWORD: terravision_secure_password
      POSTGRES_DB: terravision
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terravision -d terravision"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: terravision-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: terravision-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://terravision:terravision_secure_password@postgres:5432/terravision
      - REDIS_URL=redis://redis:6379/0
      - OPENAQ_API_KEY=${OPENAQ_API_KEY:-}
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
