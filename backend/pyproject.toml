[project]
name = "terravision-backend"
version = "0.3.1"
description = "TERRAVISION Global Environmental Intelligence Platform - FastAPI Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "sqlalchemy>=2.0.28,<3.0.0",
    "alembic>=1.13.1,<2.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "psycopg[binary]>=3.1.0,<4.0.0",
    "greenlet>=3.0.0",
    "geoalchemy2>=0.14.4,<1.0.0",
    "shapely>=2.0.3,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "redis>=5.0.3,<6.0.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1,<9.0.0",
    "pytest-asyncio>=0.23.6,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
